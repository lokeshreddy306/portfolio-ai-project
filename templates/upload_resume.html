{% extends 'base.html' %}

{% block title %}Upload Resume{% endblock %}

{% block content %}

<h2>Upload Resume</h2>

<form method="POST" enctype="multipart/form-data">

    <input type="file"
           name="resume"
           class="form-control mb-3"
           required>

    <button class="btn btn-primary">
        Upload Resume
    </button>

</form>

{% endblock %}
