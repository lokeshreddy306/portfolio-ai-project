<!DOCTYPE html>
<html>
<head>
    {% if session.get('admin') %}
                <a class="nav-link d-inline" href="/logout">Logout</a>
        {% else %}
                <a class="nav-link d-inline" href="/admin">Admin</a>
        {% endif %}

<title>{% block title %}{% endblock %}</title>

    <!-- ✅ Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- ✅ Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-light bg-white">
  <div class="container">

    <!-- Left: Logo -->
    <a class="navbar-brand" href="/">My Portfolio</a>
	<a class="nav-link d-inline text-white"
   		href="/upload-resume">
   		Upload Resume
	</a>
    <!-- Right: Links -->
    <div class="ms-auto">
      <a class="nav-link d-inline text-white" href="/">Home</a>

      <a class="nav-link d-inline text-white" href="/projects">Projects</a>

      <a class="nav-link d-inline text-white" href="/add-project">Add Project</a>
      
      <a class="nav-link d-inline text-white" href="/contact">Contact</a>
    
    </div>

  </div>
</nav>

<div class="container mt-4">
    {% block content %}{% endblock %}
</div>

</html>
